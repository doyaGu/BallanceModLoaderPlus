site_name: Ballance Mod Loader Plus
site_description: BML+ native mod, script mod, and inter-mod communication documentation.
site_url: https://doyagu.github.io/BallanceModLoaderPlus/
repo_url: https://github.com/doyaGu/BallanceModLoaderPlus
repo_name: doyaGu/BallanceModLoaderPlus
docs_dir: docs/en
site_dir: site
hooks:
  - docs/hooks/pygments_angelscript.py
  - docs/hooks/copy_api_assets.py

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra:
  alternate:
    - name: English
      link: https://doyagu.github.io/BallanceModLoaderPlus/
      lang: en
    - name: 简体中文
      link: https://doyagu.github.io/BallanceModLoaderPlus/zh-CN/
      lang: zh

nav:
  - Home: index.md
  - Use BML+: using-bml.md
  - Create mods:
      - Choose a route: modding.md
      - Native mods: native-mod-api.md
      - Script mods:
          - Start here: script-mod/index.md
          - Lifecycle and reload: script-mod/lifecycle.md
          - BML services: script-mod/services.md
          - Engine and UI: script-mod/engine-ui.md
          - Communication: script-mod/communication.md
          - API reference: script-mod/api.md
      - Cross-mod communication:
          - Overview: imc.md
          - Authoring guide: imc-author-guide.md
  - Contribute to BML+: contributing.md
