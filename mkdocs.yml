site_name: Ballance Mod Loader Plus
site_description: BML+ native mod and inter-mod communication documentation.
site_url: https://doyagu.github.io/BallanceModLoaderPlus/
repo_url: https://github.com/doyaGu/BallanceModLoaderPlus
repo_name: doyaGu/BallanceModLoaderPlus
docs_dir: docs/en
site_dir: site
hooks:
  - docs/hooks/pygments_angelscript.py

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra:
  alternate:
    - name: English
      link: https://doyagu.github.io/BallanceModLoaderPlus/
      lang: en
    - name: 简体中文
      link: https://doyagu.github.io/BallanceModLoaderPlus/zh-CN/
      lang: zh

nav:
  - Home: index.md
  - Native mod API: native-mod-api.md
  - Script mods:
      - Author guide: script-mod/author-guide.md
  - Inter-mod communication:
      - Overview: imc.md
      - Authoring guide: imc-author-guide.md
