# Configuration File for Mod: Ballance Mod Loader - 0.3.13

# GUI Settings
GUI {

	# Primary UI font. Use a filename from ModLoader\Fonts or an explicit TTF/OTF/TTC path.
	S FontFilename unifont.otf

	# Logical UI font size at a 1200-pixel viewport height (8-96).
	F FontSize 32

	# Optional fallback UI fonts, separated by semicolons. Each entry may be a filename from ModLoader\Fonts or an explicit TTF/OTF/TTC path.
	S FontFallbacks

	# Use Windows symbol and emoji fonts after configured fonts.
	B UseSystemFontFallbacks 1

	# Enable loading and saving ImGui settings.
	B EnableIniSettings 1

}

# HUD Settings
HUD {

	# Show BML Title at top
	B ShowTitle 1

	# Show FPS at top-left corner
	B ShowFPS 1

	# Show SR Timer above Time Score
	B ShowSRTimer 1

}

# Graphics Settings
Graphics {

	# Unlock Frame Rate Limitation
	B UnlockFrameRate 0

	# Set Frame Rate Limitation, this option will not work if frame rate is unlocked. Set to 0 will turn on VSync
	I SetMaxFrameRate 0

	# Improve widescreen resolutions support
	B WidescreenFix 0

}

# Tweak Settings
Tweak {

	# Enable alpha test for lantern material, this option can increase FPS
	B LanternAlphaTest 1

	# Game won't freeze when picking up life balls
	B FixLifeBallFreeze 1

	# Remove delay of spawn / respawn
	B Overclock 0

}

# Command Bar Settings
CommandBar {

	# Maximum visible time of each notification message, in seconds (default: 6)
	F MessageDuration 6

	# Tab width in columns for message wrapping (1..64, default: 4)
	I TabColumns 4

	# Line spacing between wrapped lines in messages (-1 to follow ImGui style).
	F LineSpacing -1

	# Alpha scale for message backgrounds (0..1, default: 0.80)
	F MessageBackgroundAlpha 0.8

	# Maximum text/background alpha in notifications (0..1, default: 1.0)
	F FadeMaxAlpha 1

	# Keep the command bar open after a command runs (default: false)
	B KeepOpen 0

	# Colour commands, strings, variables, operators, comments, and syntax errors.
	B EnableSyntaxHighlighting 1

	# Enable Tab completion and the completion candidate rail.
	B EnableTabCompletion 1

	# Show and accept inline suggestions from command history.
	B EnableHistorySuggestions 1

	# Enable Ctrl+R reverse history search and its transient rail.
	B EnableReverseHistorySearch 1

	# Enable filtered command-history navigation with Up and Down.
	B EnableHistoryNavigation 1

	# Show timed notification messages while the command bar is closed.
	B ShowNotifications 1

	# Show stored message scrollback while the command bar is open.
	B ShowScrollback 1

}

# Command Bar Syntax Theme
CommandBarTheme {

	# Plain input text colour as #RRGGBB or #RRGGBBAA (One Dark foreground).
	S Plain #ABB2BF

	# Registered command and alias colour (One Dark blue).
	S CommandValid #61AFEF

	# Unknown command colour (One Dark orange).
	S CommandInvalid #D19A66

	# Quoted string colour (One Dark green).
	S String #98C379

	# Variable expansion and command substitution colour (One Dark yellow).
	S Variable #E5C07B

	# Pipe, chain, separator, and newline colour (One Dark purple).
	S Operator #C678DD

	# Shell comment colour (One Dark muted foreground).
	S Comment #5C6370

	# Malformed syntax colour (One Dark red).
	S Error #E06C75

}

# Custom Map Settings
CustomMap {

	# Level number to use for custom maps (affects level bonus and sky textures). Must be in the range of 1~13; 0 to randomly select one between 2 and 11
	I LevelNumber 0

	# Show custom map's full name in tooltip
	B ShowTooltip 0

	# The max depth of the nested subdirectories.
	I MaxDepth 8

}
