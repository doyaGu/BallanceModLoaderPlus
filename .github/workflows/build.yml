name: SDL checks

on:
  push:
    branches: [ "sdl" ]
  pull_request:
    branches: [ "sdl" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdl-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-contracts:
    name: SDK, CLI and UI framework (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Configure SDK contract tests
        run: cmake -S tests/sdk -B build/sdk-contracts
      - name: Run SDK contract tests
        run: ctest --test-dir build/sdk-contracts -C Release --output-on-failure
      - name: Configure UI framework tests
        run: cmake -S tests/ui -B build/ui-framework
      - name: Build UI framework tests
        run: cmake --build build/ui-framework --config Release
      - name: Run UI framework tests
        run: ctest --test-dir build/ui-framework -C Release --output-on-failure
