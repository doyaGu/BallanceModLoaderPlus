name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PROJECT_NAME: BallanceModLoaderPlus
  BASE_BUILD_DIR: ${{ github.workspace }}\build
  BASE_DIST_DIR: ${{ github.workspace }}\dist
  VIRTOOLS_SDK_REF: 175bcb12d829c687359b90615be53524cdba0132
  CKANGELSCRIPT_VERSION: v0.5.0
  CKANGELSCRIPT_RELEASE_SHA256: 914e210bdd3f2a81d5052c189a50ce98d0cebbd4315399ab4ca142379ac98f50

jobs:
  validate-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<base>\d+\.\d+\.\d+)(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') {
            throw "Release tag must use vX.Y.Z or vX.Y.Z-prerelease format: $tag"
          }

          # CMakeLists.txt is the single source of truth for the release
          # version. The READMEs deliberately carry no version marker; they
          # link to the documentation site and the Releases page instead, so
          # they must not be released-version dependent.
          $version = $Matches.base
          $cmake = Get-Content -LiteralPath 'CMakeLists.txt' -Raw
          if ($cmake -notmatch "VERSION\s+$([regex]::Escape($version))(\s|$)") {
            throw "CMakeLists.txt project VERSION must be $version"
          }

  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [ Release, Debug ]

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Checkout Virtools SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: doyaGu/Virtools-SDK-2.1
          ref: ${{ env.VIRTOOLS_SDK_REF }}
          path: Virtools-SDK-2.1

      - name: Download CKAngelScript release
        shell: pwsh
        run: |
          $downloadDir = "${{ github.workspace }}\third-party\ckangelscript-download"
          $extractDir = "${{ github.workspace }}\third-party\ckangelscript-release"
          New-Item -ItemType Directory -Force -Path $downloadDir, $extractDir | Out-Null
          $archive = Join-Path $downloadDir "CKAngelScript-$env:CKANGELSCRIPT_VERSION-Release.zip"
          $url = "https://github.com/doyaGu/CKAngelScript/releases/download/$env:CKANGELSCRIPT_VERSION/CKAngelScript-$env:CKANGELSCRIPT_VERSION-Release.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:CKANGELSCRIPT_RELEASE_SHA256) {
            throw "CKAngelScript release hash mismatch: expected $env:CKANGELSCRIPT_RELEASE_SHA256, got $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          foreach ($required in @(
            (Join-Path $extractDir 'bin\AngelScript.dll'),
            (Join-Path $extractDir 'include\CKAngelScript.h'),
            (Join-Path $extractDir 'include\angelscript.h')
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "CKAngelScript release package is missing required file: $required"
            }
          }

      - name: Show tool versions
        shell: pwsh
        run: cmake --version

      - name: Set tag and commit variables
        shell: pwsh
        run: |
          $shortSha = git rev-parse --short HEAD
          "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
        with:
          arch: x86

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:CC = "cl"
          $env:CXX = "cl"
          cmake -G Ninja -B "${{ env.BASE_BUILD_DIR }}\${{ matrix.configuration }}" `
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} `
            -DVIRTOOLS_SDK_PATH="${{ github.workspace }}\Virtools-SDK-2.1" `
            -DBML_ENABLE_ANGELSCRIPT=ON `
            -DBML_BUILD_TESTS=ON `
            -DCKANGELSCRIPT_ROOT="${{ github.workspace }}\third-party\ckangelscript-release" `
            -DCMAKE_INSTALL_PREFIX="${{ env.BASE_DIST_DIR }}\${{ matrix.configuration }}"

      - name: Build the project
        shell: pwsh
        run: cmake --build "${{ env.BASE_BUILD_DIR }}\${{ matrix.configuration }}"

      - name: Run the test suite
        shell: pwsh
        run: ctest --test-dir "${{ env.BASE_BUILD_DIR }}\${{ matrix.configuration }}" --output-on-failure

      - name: Install binaries to distribution folder
        shell: pwsh
        run: >
          cmake --install "${{ env.BASE_BUILD_DIR }}\${{ matrix.configuration }}"
          --prefix "${{ env.BASE_DIST_DIR }}\${{ matrix.configuration }}"

      - name: Upload main-branch SDK directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BMLPlus-${{ env.SHORT_SHA }}-${{ matrix.configuration }}
          path: ${{ env.BASE_DIST_DIR }}\${{ matrix.configuration }}
          retention-days: 14

      - name: Upload tagged SDK directory
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BMLPlus-${{ github.ref_name }}-SDK-${{ matrix.configuration }}
          path: ${{ env.BASE_DIST_DIR }}\${{ matrix.configuration }}
          retention-days: 14

      - name: Upload release runtime binary
        if: startsWith(github.ref, 'refs/tags/v') && matrix.configuration == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BMLPlus-${{ github.ref_name }}-Runtime-Binary
          path: |
            ${{ env.BASE_BUILD_DIR }}\${{ matrix.configuration }}\bin\BMLPlus.dll
            ${{ env.BASE_BUILD_DIR }}\${{ matrix.configuration }}\bin\Updater.exe
          retention-days: 14

      - name: Upload debug symbols
        if: startsWith(github.ref, 'refs/tags/v') && matrix.configuration == 'Debug'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BMLPlus-${{ github.ref_name }}-Debug-Symbols
          path: ${{ env.BASE_BUILD_DIR }}\${{ matrix.configuration }}\bin\BMLPlus.pdb
          if-no-files-found: error
          retention-days: 14

  package-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ validate-release, build ]
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout Virtools SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: doyaGu/Virtools-SDK-2.1
          ref: ${{ env.VIRTOOLS_SDK_REF }}
          path: Virtools-SDK-2.1

      - name: Download Release SDK distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BMLPlus-${{ github.ref_name }}-SDK-Release
          path: ${{ github.workspace }}\tag-build-output\sdk-release

      - name: Download Debug SDK distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BMLPlus-${{ github.ref_name }}-SDK-Debug
          path: ${{ github.workspace }}\tag-build-output\sdk-debug

      - name: Download runtime binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BMLPlus-${{ github.ref_name }}-Runtime-Binary
          path: ${{ github.workspace }}\tag-build-output\runtime-bin

      - name: Download debug symbols
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BMLPlus-${{ github.ref_name }}-Debug-Symbols
          path: ${{ github.workspace }}\tag-build-output\debug-bin

      - name: Download CKAngelScript release
        shell: pwsh
        run: |
          $downloadDir = "${{ github.workspace }}\third-party\ckangelscript-download"
          $extractDir = "${{ github.workspace }}\third-party\ckangelscript-release"
          New-Item -ItemType Directory -Force -Path $downloadDir, $extractDir | Out-Null
          $archive = Join-Path $downloadDir "CKAngelScript-$env:CKANGELSCRIPT_VERSION-Release.zip"
          $url = "https://github.com/doyaGu/CKAngelScript/releases/download/$env:CKANGELSCRIPT_VERSION/CKAngelScript-$env:CKANGELSCRIPT_VERSION-Release.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:CKANGELSCRIPT_RELEASE_SHA256) {
            throw "CKAngelScript release hash mismatch: expected $env:CKANGELSCRIPT_RELEASE_SHA256, got $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          foreach ($required in @(
            (Join-Path $extractDir 'bin\AngelScript.dll'),
            (Join-Path $extractDir 'include\CKAngelScript.h'),
            (Join-Path $extractDir 'include\angelscript.h')
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "CKAngelScript release package is missing required file: $required"
            }
          }

      - name: Create release packages
        env:
          UPDATER_BASE_URL: ${{ vars.BML_UPDATER_BASE_URL }}
          UPDATER_DEFAULT_CHANNEL: ${{ vars.BML_UPDATER_DEFAULT_CHANNEL }}
        shell: pwsh
        run: |
          $packageArgs = @{
            Version = "${{ github.ref_name }}"
            ReleaseInstallDir = "${{ github.workspace }}\tag-build-output\sdk-release"
            DebugInstallDir = "${{ github.workspace }}\tag-build-output\sdk-debug"
            ReleaseBinaryDir = "${{ github.workspace }}\tag-build-output\runtime-bin"
            DebugBinaryDir = "${{ github.workspace }}\tag-build-output\debug-bin"
            OutputDir = "${{ github.workspace }}\packages"
            CKAngelScriptRuntimeDir = "${{ github.workspace }}\third-party\ckangelscript-release"
            IncludeAngelScript = $true
            SkipUpdateSigning = $true
          }
          if ($env:UPDATER_BASE_URL) {
            $packageArgs.UpdaterBaseUrl = $env:UPDATER_BASE_URL
            if ($env:UPDATER_DEFAULT_CHANNEL) {
              $packageArgs.UpdaterDefaultChannel = $env:UPDATER_DEFAULT_CHANNEL
            }
          }
          .\scripts\Package-BMLRelease.ps1 @packageArgs

          Import-Module .\scripts\lib\BMLReleaseFiles.psm1 -Force
          Assert-BMLReleaseFiles `
            -Directory "${{ github.workspace }}\packages" `
            -Version "${{ github.ref_name }}" `
            -SignatureState Unsigned
          Assert-BMLUpdaterManifestMatchesPackage `
            -Directory "${{ github.workspace }}\packages" `
            -Version "${{ github.ref_name }}"

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
        with:
          arch: x86

      - name: Validate packaged SDK consumers
        shell: pwsh
        run: |
          $cmake = (Get-Command cmake.exe).Source
          $dumpbin = (Get-Command dumpbin.exe).Source
          $variants = @(
            [pscustomobject]@{ Name = 'Release'; Pattern = 'BMLPlus-SDK-*-Release.zip' }
            [pscustomobject]@{ Name = 'Debug'; Pattern = 'BMLPlus-SDK-*-Debug.zip' }
          )

          foreach ($variant in $variants) {
            $archives = @(Get-ChildItem -LiteralPath "${{ github.workspace }}\packages" -Filter $variant.Pattern)
            if ($archives.Count -ne 1) {
              throw "Expected one $($variant.Name) SDK archive, found $($archives.Count)."
            }

            $arguments = @(
              "-DCMAKE_EXECUTABLE=$cmake"
              "-DSOURCE_ROOT=${{ github.workspace }}"
              "-DSDK_ARCHIVE=$($archives[0].FullName)"
              "-DWORK_ROOT=${{ github.workspace }}\build\$($variant.Name.ToLowerInvariant())-sdk-consumer"
              '-DGENERATOR=Ninja'
              "-DCONFIGURATION=$($variant.Name)"
              "-DVIRTOOLS_SDK_PATH=${{ github.workspace }}\Virtools-SDK-2.1"
              "-DDUMPBIN=$dumpbin"
              '-P'
              "${{ github.workspace }}\tests\LegacyNativeSdkConsumerTest.cmake"
            )
            & $cmake @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged $($variant.Name) SDK consumer validation failed with exit code $LASTEXITCODE."
            }
          }

      - name: Upload four ZIP files and updater manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BMLPlus-${{ github.ref_name }}-Unsigned-Release-Files
          path: |
            ${{ github.workspace }}\packages\*.zip
            ${{ github.workspace }}\packages\*.manifest.json
          retention-days: 30
