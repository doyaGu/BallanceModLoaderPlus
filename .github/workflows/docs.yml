name: Docs

on:
  push:
    branches: [ "sdl" ]
  pull_request:
    branches: [ "sdl" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build English documentation
        run: mkdocs build --strict --config-file mkdocs.yml

      - name: Build Simplified Chinese documentation
        run: mkdocs build --strict --config-file mkdocs.zh-CN.yml

      - name: Protect updater namespace
        shell: bash
        run: |
          if [ -e site/updates ]; then
            echo "Documentation output must not claim the reserved /updates namespace."
            exit 1
          fi

      - name: Upload documentation site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/sdl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-site-${{ github.sha }}
          path: site
          retention-days: 1
